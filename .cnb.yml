# 上游同步：仓库页「同步上游」按钮触发（.cnb/web_trigger.yml）。
# 三方合并逻辑在 scripts/sync_upstream.sh，基线见 scripts/upstreams.txt。
# api_trigger_sync_upstream 是同一套流程的 API 入口，便于用 cnb CLI 手动验证。
$:
  # 云原生开发：不声明 docker.image，沿用默认镜像 cnbcool/default-dev-env。
  # CodeBuddy Web 经 cnb.cool 反向代理访问，Host 既不是 localhost / IP，也不是 tunnel
  # 域名，会被 Gateway 的 DNS rebinding 保护拦成 {"error":"Host not allowed"}；关掉校验。
  vscode:
    - services:
        - vscode
      env:
        CODEBUDDY_DISABLE_HOST_VALIDATION: "1"
  web_trigger_sync_upstream: &sync_upstream
    - docker:
        image: golang:1.26.10
      stages:
        - name: 配置 git 身份
          script: |
            git config user.name "cnb"
            git config user.email "cnb@cnb.cool"
        - name: 同步上游（合并 + 刷新基线 + 编译测试 + 提交）
          script: |
            bash scripts/sync_upstream.sh --auto
        - name: 推送
          script: |
            if [ "${push:-true}" != "true" ]; then
              echo "未勾选推送，提交仅留在构建环境"
              exit 0
            fi
            if [ -z "$(git log origin/${CNB_BRANCH:-main}..HEAD --oneline 2>/dev/null)" ]; then
              echo "没有新提交，无需推送"
              exit 0
            fi
            git push "https://cnb:${CNB_TOKEN}@cnb.cool/${CNB_REPO_SLUG}.git" "HEAD:${CNB_BRANCH:-main}"
  api_trigger_sync_upstream: *sync_upstream

# 镜像构建：main 有提交（含上面的同步推送）即构建并推送到 CNB Docker 制品库，
# 服务器用 docker-compose.prod.yml 拉取，watchtower 按标签自动更新。
main:
  push:
    - services:
        - docker
      stages:
        - name: 构建镜像
          script: |
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker build \
              -t "${IMAGE}:latest" \
              -t "${IMAGE}:sha-${CNB_COMMIT_SHORT}" \
              .
        - name: 登录并推送
          script: |
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            echo "${CNB_TOKEN}" | docker login -u cnb --password-stdin "${CNB_DOCKER_REGISTRY}"
            docker push "${IMAGE}:latest"
            docker push "${IMAGE}:sha-${CNB_COMMIT_SHORT}"
